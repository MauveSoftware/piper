version: 2

dist: artifacts

before:
  hooks:
    - go mod download

builds:
  - binary: piper
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - linux
    goarch:
      - amd64
      - arm
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

checksum:
  name_template: checksums.txt
